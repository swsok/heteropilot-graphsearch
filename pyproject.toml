# Mirrors vendor/heteropilot's settings so code moving between the two repos
# does not have to change shape. `vendor` is excluded from every tool: it is a
# read-only checkout of another repository and its lint debt is not ours.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF", "SIM"]

[tool.mypy]
files = ["graphsearch"]
ignore_missing_imports = true
exclude = ["vendor/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is the GS-25 evidence: enumerating every replica ordering on the
# seven-device real cluster to prove the closed form counts the same thing.
# It takes about a minute, so it is opt-in rather than in every run --
# `pytest -m slow`. The formula it checks is exercised by the fast tests on
# the toy fixtures on every run, so skipping it does not leave the claim
# untested, only less thoroughly tested.
markers = ["slow: enumerates every replica ordering; ~1 min (GS-25 evidence)"]
# networkx changed what `weisfeiler_lehman_graph_hash` returns between
# releases and warns about it. The warning is correct and this repository
# already acts on it -- `Signature.tool_version` records the version so a hash
# is never compared across one -- so it is noise in a test run rather than
# news. Scoped to the one module: a hashing warning from anywhere else is
# something we have not thought about yet and should still be visible.
#
# Pre-emptive: it cannot be reproduced here, because the release that emits it
# needs Python 3.11 and this repository runs 3.10 (see requirements.txt).
filterwarnings = [
    "ignore::FutureWarning:networkx.algorithms.graph_hashing",
]
