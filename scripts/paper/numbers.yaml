# name -> which cell of which results file. `scripts/paper/numbers.py` turns
# each into a \newcommand in paper/numbers.tex.
#
# Add an entry before writing a number into prose. A literal in a section is
# caught by `make check`, which is the point: a number in the body is a number
# that will be wrong after the next re-run and nobody will notice.

