# Which columns of a results table the paper shows (revision R1.1).
#
# Keyed by the label stem `md_to_tex.py` writes a table under: the results
# file's stem, plus `_N` for its N-th table. A table not named here is set
# whole, as before, with a warning when it has more than seven columns.
#
#   columns  the columns shown, in order. A string is a column of the table
#            (or of a `join`); `{name:, cells: [a, b], sep:}` sets two cells
#            side by side. A column the table lacks is an error, so a results
#            script that renames one cannot make it vanish from the paper.
#   labels   header text, by column (or composite) name.
#   join     columns taken from another table of the same file, matched on
#            the first column; `find` names headers that identify that table.
#   width    column (a `table`) or page (a `table*`).
#   size     small | footnotesize | scriptsize.
#
# Nothing here changes a cell. What is left out is still in the results file,
# which the artifact carries.

# Table I -- E-G3, correctness under the real simulator.
e_g3_real_sim_oracle:
  width: page
  size: small
  join:
    - {find: [fixture, saving_s, cold], columns: [saving_s]}
  columns: [fixture, embeddings, representatives, compression_ratio,
            false_infeasible, mismerged_pairs, complete, unjudged, saving_s]
  labels:
    compression_ratio: ratio
    false_infeasible: false inf.
    mismerged_pairs: mis-merged
    saving_s: saving (s)

# Table II -- E-G6, scale. The other timing columns stay in the results file,
# and so do the 32- and 64-device rows (R5.5, for the page budget).
e_g6_scale:
  width: column
  size: footnotesize
  where: {devices: ["128"]}
  columns: [devices, symmetry, embeddings, representatives, compression_ratio,
            t_vf2_s, t_total_s]
  labels:
    compression_ratio: ratio
    t_vf2_s: VF2 (s)
    t_total_s: total (s)

# Below Table II -- E-G6's registered failure condition, under the real
# simulator (revision R4.1). One row; the correctness counts are in the prose.
e_g6_real_sim:
  width: column
  size: footnotesize
  columns: [condition, oracle_simulations, proposed_simulations, t_oracle_s,
            t_proposed_s, saving_s, complete]
  labels:
    oracle_simulations: oracle sims
    proposed_simulations: proposed sims
    t_oracle_s: oracle (s)
    t_proposed_s: proposed (s)
    saving_s: saving (s)

# Table IV -- E-G7, holdout. Page width: in one column its seven columns were
# shrunk past reading size.
e_g7_holdout:
  width: page
  size: small
  join:
    - {find: [fixture, "`full` at k = 16", "heteropilot at k = 16"],
       columns: ["`full` at k = 16", "heteropilot at k = 16"]}
  columns:
    - fixture
    - embeddings
    - representatives
    - compression_ratio
    - false_infeasible
    - mismerged_pairs
    - {name: recall16, cells: ["`full` at k = 16", "heteropilot at k = 16"], sep: " / "}
  labels:
    compression_ratio: ratio
    false_infeasible: false inf.
    mismerged_pairs: mis-merged
    recall16: recall@16 (ours / surrogate)

# Table V -- E-G5, the placement result. TPOT and goodput are a sentence and
# two macros in the text.
e_g5_real_hardware:
  width: page
  size: small
  columns: [placement, devices, "p99 TTFT pred", predicted, "p99 TTFT median",
            range, "vs T1", measured]

# E-G5, verdict agreement on independent deployments (restored by R1.4). The
# all-rows table beside it in the results file counts duplicates and
# bound-stress rows, and the paper does not cite it.
e_g5_real_hardware_3:
  caption: "E-G5 -- verdict agreement, independent deployments of the recommendation"
  width: column
  size: small
  columns: [placement, deployments, agree, disagree]

# E-G7, the corpus-wide ablation (restored by R1.4).
e_g7_ablation:
  width: page
  size: small
  columns: [fixture, arm, false_infeasible, mismerged_pairs, compression_ratio,
            representatives, simulations, feasible_recall]
  labels:
    false_infeasible: false inf.
    mismerged_pairs: mis-merged
    compression_ratio: ratio
    feasible_recall: recall

# Table -- E-G8, prefill/decode across two accelerator types (revision R5.5).
# The per-direction tables, the knee pilot and the floor sensitivity stay in
# the results file.
e_g8_hetero_pd:
  caption: "E-G8 -- P/D across two accelerator types, 1 rps, three repetitions per row"
  width: page
  size: footnotesize
  columns:
    - run
    - {name: three, cells: [predicted, measured], sep: " / "}
    - agree
    - {name: lat, cells: ["predicted (latency)", "measured (latency)"], sep: " / "}
    - "agree (latency)"
    - {name: ttft, cells: ["p99 TTFT predicted", "p99 TTFT measured"], sep: " / "}
    - {name: kv, cells: ["KV change", "predicted change"], sep: " / "}
    - ratio
  labels:
    three: "three axes: predicted / measured"
    lat: "latency only: predicted / measured"
    "agree (latency)": agree
    ttft: "p99 TTFT: predicted / measured median [range]"
    kv: "KV interval change: measured / predicted"
