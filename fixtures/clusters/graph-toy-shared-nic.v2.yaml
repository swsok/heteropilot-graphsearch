# Fictional. Two nodes that are identical in every local attribute -- same two
# GPUs, same NVLINK between them, same price -- and differ ONLY in what is
# already using their uplink. X's is 6 of 10 GB/s held by something outside this
# deployment; Y's is free.
#
# That difference is invisible to the envelope key and to any bound that reads
# only the island. It is the case the exact-equivalence layer exists to catch:
# fold these two and you have merged a candidate that will miss its SLO with one
# that will not. `include_boundary=False` is the ablation that does exactly that,
# and the oracle harness reports the mis-merge.
#
# The v1 copy can say only THAT the links share something (contention_group),
# not how much is left, which is why the capacity lives in the v2 file.
# Every number is source: placeholder.
cluster_id: graph-toy-shared-nic
schema_version: 2
nodes:
  - id: nodeX
    cpu_sockets:
      - {id: sock0, numa_node: 0}
    host_price_per_hour_usd: 1.0
    accelerators:
      - {id: gpu0, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml, price_per_hour_usd: 2.0}
      - {id: gpu1, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml, price_per_hour_usd: 2.0}
    nics:
      - {id: nic0, type: ethernet, speed_gbps: 10}
  - id: nodeY
    cpu_sockets:
      - {id: sock0, numa_node: 0}
    host_price_per_hour_usd: 1.0
    accelerators:
      - {id: gpu0, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml, price_per_hour_usd: 2.0}
      - {id: gpu1, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml, price_per_hour_usd: 2.0}
    nics:
      - {id: nic0, type: ethernet, speed_gbps: 10}

net_switches:
  - {id: sw0, ports: 8}

shared_resources:
  # The whole point of this fixture: same capacity, different reservation.
  - {id: uplink-nodeX, kind: pcie_uplink, capacity: 10.0, unit: "GB/s",
     reserved: 6.0, node: nodeX, source: placeholder}
  - {id: uplink-nodeY, kind: pcie_uplink, capacity: 10.0, unit: "GB/s",
     reserved: 0.0, node: nodeY, source: placeholder}

links:
  - {id: l-nodeX-nv, src: nodeX/gpu0, dst: nodeX/gpu1, type: NVLINK,
     bandwidth_gbps: 112.5, latency_ns: 500, source: placeholder}
  - {id: l-nodeX-uplink, src: nodeX/gpu0, dst: nodeX/nic0, type: PCIE,
     bandwidth_gbps: 10.0, latency_ns: 900, shared_resource: uplink-nodeX, source: placeholder}
  - {id: l-nodeY-nv, src: nodeY/gpu0, dst: nodeY/gpu1, type: NVLINK,
     bandwidth_gbps: 112.5, latency_ns: 500, source: placeholder}
  - {id: l-nodeY-uplink, src: nodeY/gpu0, dst: nodeY/nic0, type: PCIE,
     bandwidth_gbps: 10.0, latency_ns: 900, shared_resource: uplink-nodeY, source: placeholder}
  - {id: l-nodeX-sw, src: nodeX/nic0, dst: sw0, type: ETHERNET,
     bandwidth_gbps: 10.0, latency_ns: 5000, source: placeholder}
  - {id: l-nodeY-sw, src: nodeY/nic0, dst: sw0, type: ETHERNET,
     bandwidth_gbps: 10.0, latency_ns: 5000, source: placeholder}
