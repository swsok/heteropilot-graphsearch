# Fictional. The FAILURE CONDITION, kept as a fixture on purpose.
#
# Five nodes, no two alike: every uplink capacity, every reservation and every
# price differs. Exact equivalence therefore folds nothing -- representatives
# == embeddings -- and the compression ratio is 1.0, which the research design
# lists among the ways this approach can fail to pay for itself.
#
# It is here so that number gets measured and reported rather than avoided, and
# so the correctness properties (no false-infeasible, no mis-merge) are checked
# on a cluster where compression buys nothing. Every number is placeholder.
