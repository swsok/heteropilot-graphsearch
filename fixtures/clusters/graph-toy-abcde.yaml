# Fictional cluster, not hardware. Reproduces the example in
# docs/HeteroPilot_그래프기반_배치탐색_연구설계.md §9: A and B carry two GPUs each
# behind a 10 GB/s uplink, C and D two each behind 5 GB/s, E two NPUs. A/B and
# C/D are identical to each other in every attribute that matters, which is what
# makes the compression in §9 exact rather than approximate.
# Every number is source: placeholder (absolute rule 3). Do not plan on it.
cluster_id: graph-toy-abcde
nodes:
  - id: nodeA
    accelerators:
      - {id: gpu0, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml}
      - {id: gpu1, type: GPU, vendor: TOY, model: TOYGPU, backend: cuda, memory_gb: 80,
         profile: fixtures/profiles/toy_gpu.yaml}
    nics:
      - {id: nic0, type: ethernet, speed_gbps: 10}
  - id: nodeB
    accelerators:
